# Render Blueprint - https://render.com/docs/blueprint-spec
services:
  - type: web
    name: workout-web-app
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: MONGODB_URI
        sync: false
